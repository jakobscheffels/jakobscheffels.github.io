# Modern Homepage Template

Save this as `index.html`.

```html
<!DOCTYPE html>

      box-sizing: border-box;

      line-height: 1.6;

      color: inherit;

    .container {
      width: 90%;
      max-width: 1200px;
      margin: auto;

      padding: 24px 0;

      backdrop-filter: blur(10px);
      z-index: 100;

    nav {

      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 800;
    }

    .nav-links {
      display: flex;
      gap: 24px;
    }

    .nav-links a {
      color: #cbd5e1;
      transition: color 0.3s;
    }

    .nav-links a:hover {
      color: white;

      min-height: 90vh;

    }

    .hero-content h1 {
      font-size: 4rem;
      font-weight: 800;
      margin-bottom: 20px;
    }

    .hero-content p {
      max-width: 700px;
      margin: auto;
      color: #cbd5e1;
      font-size: 1.2rem;
      margin-bottom: 32px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 14px 28px;
      border-radius: 999px;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background: #2563eb;
    }

    .btn-primary:hover {
      background: #1d4ed8;
      transform: translateY(-2px);
    }

    .btn-secondary {
      border: 1px solid #475569;
      color: #e2e8f0;
    }

    .btn-secondary:hover {
      background: #1e293b;
      transform: translateY(-2px);
    }

    .features {
      padding: 100px 0;
    }

    .section-title {
      text-align: center;
      margin-bottom: 60px;
    }

    .section-title h2 {
      font-size: 2.5rem;
      margin-bottom: 12px;
    }

    .section-title p {
      color: #94a3b8;
    }

    .feature-grid {
      display: grid;

    }
